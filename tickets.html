<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <body data-page="tickets-list">

  <h1>Tickets</h1>

  <div class="filters">

    <input
      type="text"
      id="searchInput"
      placeholder="Search tickets..."
    />

    <select id="statusFilter" aria-label="Status Filter">
      <option value="">All Status</option>
      <option value="open">Open</option>
      <option value="in-progress">In Progress</option>
      <option value="resolved">Resolved</option>
      <option value="closed">Closed</option>
    </select>

    <select id="priorityFilter" aria-label="Priority Filter">
      <option value="">All Priority</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="urgent">Urgent</option>
    </select>

    <select id="assigneeFilter" aria-label="Assignee Filter"> </select>

    <select id="sortFilter" aria-label="Sort Filter">
      <option value="createdAt">Newest</option>
      <option value="priority">Priority</option>
      <option value="status">Status</option>
    </select>

  </div>

  <div id="ticketsContainer"></div>

  <div id="pagination"></div>

</body>

</html>
