<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskHub — Dashboard</title>
</head>
<body data-page="dashboard">
  <div class="dashboard-container">
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p class="welcome-line">
          Welcome, <span id="welcome-name">Agent</span>
        </p>
        <span class="date" id="dashboard-date"></span>
      </div>

      <button type="button" id="logout-btn" class="logout-btn">Logout</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="label">TOTAL TICKETS</span>
        <h2 id="stat-total">—</h2>
        <p>all time</p>
      </div>

      <div class="stat-card amber">
        <span class="label">OPEN</span>
        <h2 id="stat-open">—</h2>
        <p>needs action</p>
      </div>

      <div class="stat-card blue">
        <span class="label">IN PROGRESS</span>
        <h2 id="stat-in-progress">—</h2>
        <p>being worked</p>
      </div>

      <div class="stat-card green">
        <span class="label">RESOLVED</span>
        <h2 id="stat-resolved">—</h2>
        <p>awaiting close</p>
      </div>
    </div>

    <div class="tickets-section">
      <div class="section-header">
        <h2>Recent tickets</h2>
        <a href="/tickets.html" class="link-view-all">View all tickets →</a>
      </div>

      <div class="table-wrap dashboard-recent-wrap">
        <table class="dashboard-recent-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Title</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Created</th>
              <th class="th-actions">Details</th>
            </tr>
          </thead>
          <tbody id="recent-tickets-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
